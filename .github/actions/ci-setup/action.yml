name: CI setup (pnpm + Node)
description: Install pnpm, Node, and workspace dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm install -g tsx
      shell: bash
